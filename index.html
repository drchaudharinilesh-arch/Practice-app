<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neuro Logbook by Dr. Nilesh Chaudhari</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#070a13" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #070a13;
      color: #e2e8f0;
    }
    .obsidian-bg {
      background: radial-gradient(circle at 15% 15%, rgba(45, 212, 191, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 85% 65%, rgba(99, 102, 241, 0.10) 0%, transparent 45%),
                  radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                  #070a13;
      background-attachment: fixed;
    }
    .neural-mesh {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.4);
    }
    .frosted-glass {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }
    .frosted-card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }
    .floating-glass-dock {
      background: rgba(11, 15, 26, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
    }
    .glass-input:focus {
      border-color: rgba(99, 102, 241, 0.6) !important;
      outline: none;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="obsidian-bg neural-mesh min-h-screen pb-28 text-slate-200">

  <!-- Direct Application Dashboard -->
  <div id="authenticatedApp" class="block w-full">
    <!-- Header -->
    <header class="liquid-glass border-b border-white/10 p-4 sticky top-0 z-30 flex justify-between items-center shadow-lg">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-lg">🧠</span>
          <div>
            <h1 class="text-sm font-extrabold tracking-tight bg-gradient-to-r from-white via-indigo-200 to-slate-400 bg-clip-text text-transparent">
              Neuro Logbook
            </h1>
            <p class="text-[10px] text-indigo-300/80 font-semibold">Dr. Nilesh Chaudhari</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="forceRefreshAll()" class="p-2 bg-slate-800/60 hover:bg-slate-700/80 border border-white/10 rounded-xl text-xs text-indigo-300" title="Refresh Records">
          🔄
        </button>
        <button onclick="exportDataBackup()" class="p-2 bg-indigo-900/40 hover:bg-indigo-800/60 border border-indigo-500/30 rounded-xl text-xs font-semibold text-indigo-200 flex items-center gap-1">
          💾 Backup
        </button>
      </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
      <!-- View 1: Main Ledger & Financial Summary -->
      <div id="viewEntries" class="space-y-4">
        
        <!-- Symmetrical 2x2 Glass Matrix Cards -->
        <section class="frosted-glass rounded-3xl p-4 space-y-3 shadow-xl">
          <div class="grid grid-cols-2 gap-2.5">
            
            <!-- Card 1: Total Revenue -->
            <div class="liquid-glass rounded-2xl p-3.5 border border-indigo-500/20 relative overflow-hidden flex flex-col justify-between h-28">
              <div class="flex justify-between items-start">
                <span id="revenuePeriodLabel" class="text-[10px] font-bold text-indigo-300 uppercase tracking-wider">Revenue</span>
                <span class="text-xs">💰</span>
              </div>
              <div>
                <div id="statTotal" class="text-xl font-black text-white tracking-tight">₹0</div>
                <p class="text-[10px] text-slate-400 font-medium mt-0.5">Total Practice</p>
              </div>
            </div>

            <!-- Card 2: Pending Claims -->
            <button onclick="openPendingReceivablesModal()" class="liquid-glass hover:bg-amber-950/30 active:scale-98 rounded-2xl p-3.5 border border-amber-500/25 relative overflow-hidden flex flex-col justify-between text-left transition h-28">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-amber-300 uppercase tracking-wider">Pending Claims</span>
                <span class="text-[10px] text-amber-400 font-bold">Track ↗</span>
              </div>
              <div>
                <div id="statPendingReceivables" class="text-xl font-black text-amber-200 tracking-tight">₹0</div>
                <p class="text-[10px] text-amber-300/70 font-medium mt-0.5">PMJAY / TPA Due</p>
              </div>
            </button>

            <!-- Card 3: OPD Consultations -->
            <button onclick="openOpdAuditModal()" class="liquid-glass hover:bg-blue-950/30 active:scale-98 rounded-2xl p-3.5 border border-blue-500/20 relative overflow-hidden flex flex-col justify-between text-left transition h-28">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-blue-300 uppercase tracking-wider">OPD Cons.</span>
                <span class="text-[10px] text-blue-400 font-bold">Register ↗</span>
              </div>
              <div>
                <div id="statOpdIndoor" class="text-xl font-black text-white tracking-tight">₹0</div>
                <p class="text-[10px] text-blue-300/70 font-medium mt-0.5">Outpatient Rounds</p>
              </div>
            </button>

            <!-- Card 4: Surgeries Done -->
            <button onclick="openSurgeryAuditModal()" class="liquid-glass hover:bg-emerald-950/30 active:scale-98 rounded-2xl p-3.5 border border-emerald-500/25 relative overflow-hidden flex flex-col justify-between text-left transition h-28">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-emerald-300 uppercase tracking-wider">Surgeries</span>
                <span class="text-[10px] text-emerald-400 font-bold">OT List ↗</span>
              </div>
              <div>
                <div id="statSurgery" class="text-xl font-black text-emerald-200 tracking-tight">₹0</div>
                <p class="text-[10px] text-emerald-300/70 font-medium mt-0.5">Operated Cases</p>
              </div>
            </button>

          </div>

          <!-- Hospital Breakdown Accordion -->
          <details class="text-xs liquid-glass p-2.5 rounded-2xl cursor-pointer">
            <summary class="font-bold text-slate-300 flex justify-between items-center select-none text-[11px]">
              <span>🏥 Hospital-wise Breakdown</span>
              <span class="text-[10px] text-indigo-400 font-semibold">View details ▼</span>
            </summary>
            <div id="hospitalBreakdownList" class="pt-2 space-y-1.5 border-t border-white/10 mt-2 text-slate-400 text-xs"></div>
          </details>
        </section>

        <!-- Quick Action Buttons -->
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col items-center justify-center bg-gradient-to-br from-indigo-600 to-indigo-800 hover:from-indigo-500 hover:to-indigo-700 active:scale-95 text-white rounded-3xl p-3.5 shadow-xl shadow-indigo-950/50 cursor-pointer min-h-[72px] border border-indigo-400/30 transition">
            <span class="text-xl">📷</span>
            <span class="text-xs font-extrabold mt-0.5 tracking-wide">Scan Doc / Slip</span>
            <input type="file" id="scanInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)" />
          </label>
          <button
